server:
  port: 8080

spring:
  application:
    name: sanitaslink-backend

  # Credentials are required: the application fails fast when the environment
  # variables are missing. No production-default passwords are shipped.
  datasource:
    url: ${SANITASLINK_DB_URL:jdbc:postgresql://localhost:5432/sanitaslink_db}
    username: ${SANITASLINK_DB_USERNAME}
    password: ${SANITASLINK_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    url: ${SANITASLINK_FLYWAY_URL:jdbc:postgresql://localhost:5432/sanitaslink_db}
    user: ${SANITASLINK_FLYWAY_USER}
    password: ${SANITASLINK_FLYWAY_PASSWORD}
    locations:
      - classpath:db/migration

sanitaslink:
  office:
    require-context: false
  security:
    jwt:
      secret: ${SANITASLINK_JWT_SECRET:}
      issuer: sanitaslink-backend
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    encryption:
      key: ${SANITASLINK_ENCRYPTION_KEY}
      previous-key: ${SANITASLINK_ENCRYPTION_PREVIOUS_KEY:}
      version: ${SANITASLINK_ENCRYPTION_VERSION:1}
    login-rate-limit:
      max-requests: 30
      window: 1m
      trusted-proxy: false
    refresh-cookie:
      name: sl_refresh
      secure: true
      same-site: Strict
      path: /api/v1/auth
    cors:
      allowed-origins: ${SANITASLINK_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  tokens:
    invitation-ttl: 72h
    password-reset-ttl: 24h
  notifications:
    log-secrets: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    username: app_user
    password: app_user
  flyway:
    user: db_owner
    password: db_owner
sanitaslink:
  security:
    jwt:
      secret: c2FuaXRhc2xpbmstZGV2LWhtYWMtc2VjcmV0LWtleS0wMTIzNDU2Nzg5YWJjZGVmLTAxMjM0NTY3ODk=
    encryption:
      key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      version: 1
    refresh-cookie:
      secure: false
  notifications:
    log-secrets: true
