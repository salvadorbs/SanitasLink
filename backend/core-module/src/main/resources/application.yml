server:
  port: 8080

spring:
  application:
    name: sanitaslink-backend

  datasource:
    url: ${SANITASLINK_DB_URL:jdbc:postgresql://localhost:5432/sanitaslink_db}
    username: ${SANITASLINK_DB_USERNAME:app_user}
    password: ${SANITASLINK_DB_PASSWORD:app_user}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    url: ${SANITASLINK_FLYWAY_URL:jdbc:postgresql://localhost:5432/sanitaslink_db}
    user: ${SANITASLINK_FLYWAY_USER:db_owner}
    password: ${SANITASLINK_FLYWAY_PASSWORD:db_owner}
    locations:
      - classpath:db/migration

sanitaslink:
  office:
    require-context: false
  security:
    jwt:
      secret: ${SANITASLINK_JWT_SECRET:}
      issuer: sanitaslink-backend
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    login-rate-limit:
      max-requests: 30
      window: 1m
      trusted-proxy: false
    cors:
      allowed-origins:
        - http://localhost:5173
  tokens:
    invitation-ttl: 72h
    password-reset-ttl: 24h
  notifications:
    log-secrets: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
---
spring:
  config:
    activate:
      on-profile: dev
sanitaslink:
  security:
    jwt:
      secret: c2FuaXRhc2xpbmstZGV2LWhtYWMtc2VjcmV0LWtleS0wMTIzNDU2Nzg5YWJjZGVmLTAxMjM0NTY3ODk=
  notifications:
    log-secrets: true
