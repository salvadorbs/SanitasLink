server:
  port: 8080

spring:
  application:
    name: sanitaslink-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/sanitaslink_db
    username: sanitaslink_user
    password: sanitaslink_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html