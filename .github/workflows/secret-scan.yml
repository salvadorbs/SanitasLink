name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks on the full history
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            gitleaks/gitleaks:latest detect \
            --source=/src \
            --log-opts="--all --full-history" \
            --no-banner
