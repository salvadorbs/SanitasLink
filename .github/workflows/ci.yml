name: ci

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: ./mvnw clean verify

  frontend:
    name: Frontend lint, typecheck, tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check generated API client is up to date
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sanitaslink_db
          POSTGRES_USER: db_owner
          POSTGRES_PASSWORD: db_owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U db_owner -d sanitaslink_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # The service container cannot mount the init script: a file bind mount to a destination
      # that does not exist in the image becomes a directory, which broke initdb. Replicate
      # docker/postgres-init.sql over stdin as db_owner before the backend starts (this mirrors
      # exactly what Testcontainers does with withInitScript in AuthAndOfficeIntegrationTest).
      - name: Bootstrap database roles
        run: >-
          docker run --rm --network host -i -e PGPASSWORD=db_owner
          postgres:16-alpine psql -h localhost -U db_owner -d sanitaslink_db
          -v ON_ERROR_STOP=1 < docker/postgres-init.sql

      # `-pl app-module` resolves the sibling SNAPSHOT modules from the local Maven repo, so
      # install the reactor first (the e2e job does not run the backend job's `clean verify`).
      - name: Apply Flyway migrations
        working-directory: backend
        run: >-
          ./mvnw -q -DskipTests install &&
          ./mvnw -q -pl app-module flyway:migrate
          -Dflyway.url=jdbc:postgresql://localhost:5432/sanitaslink_db
          -Dflyway.user=db_owner
          -Dflyway.password=db_owner
          -Dflyway.locations=filesystem:core-module/src/main/resources/db/migration,filesystem:patient-module/src/main/resources/db/migration,filesystem:appointment-module/src/main/resources/db/migration,filesystem:prescription-module/src/main/resources/db/migration

      - name: Seed E2E data
        run: >-
          docker run --rm --network host -i -e PGPASSWORD=db_owner
          postgres:16-alpine psql -h localhost -U db_owner -d sanitaslink_db
          -v ON_ERROR_STOP=1 < docker/e2e-seed.sql

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
