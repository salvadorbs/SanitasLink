# Local development stack. The credentials below are LOCAL-DEVELOPMENT ONLY and must be
# overridden via environment variables in any shared or production deployment.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sanitaslink-postgres
    environment:
      POSTGRES_DB: sanitaslink_db
      POSTGRES_USER: ${POSTGRES_USER:db_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:db_owner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-db_owner} -d sanitaslink_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
