services:
  postgres:
    image: postgres:16-alpine
    container_name: sanitaslink-postgres
    environment:
      POSTGRES_DB: sanitaslink_db
      POSTGRES_USER: sanitaslink_user
      POSTGRES_PASSWORD: sanitaslink_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanitaslink_user -d sanitaslink_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sanitaslink-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
